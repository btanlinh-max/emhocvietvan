<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Em Học Viết Văn</title>
<meta name="description" content="Web giúp học sinh lớp 4 học viết văn theo từng bước: tả con vật, tả cây cối…, có AI Gemini nhận xét.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap">
<style>
/* Layout: a school exercise book (vở ô li) — blue ink for the child's work, teacher's red pen for corrections, one step per screen. */
:root{
  --bg:#eef3f8; --surface:#ffffff; --paper:#fffffe;
  --fg:#16263a; --muted:#56677d;
  --ink:#1c5bb5; --ink-soft:#e3eefc; --on-ink:#ffffff;
  --red:#d2343a; --red-soft:#fde8e8;
  --ok:#1f7d48; --ok-soft:#e1f4e8;
  --warn:#a35d00; --warn-soft:#fff1d6;
  --line:#b9cdea; --line-faint:#e4ecf8; --margin:#eeb1b4;
  --border:#d6e0ec; --chip:#f2f6fc;
  --f-display:"Mali","Quicksand",system-ui,sans-serif;
  --f-body:"Quicksand",system-ui,-apple-system,"Segoe UI",sans-serif;
  --lh:2.25rem;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1622; --surface:#172131; --paper:#141d2b;
  --fg:#e7eef8; --muted:#9fb0c6;
  --ink:#8fbaf5; --ink-soft:#1d3352; --on-ink:#0d1726;
  --red:#ff8087; --red-soft:#3a1d24;
  --ok:#6fd796; --ok-soft:#183324;
  --warn:#ffc163; --warn-soft:#3a2c14;
  --line:#2e4566; --line-faint:#1c2a3e; --margin:#5e2d38;
  --border:#283a52; --chip:#1c2a3d; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1622; --surface:#172131; --paper:#141d2b;
  --fg:#e7eef8; --muted:#9fb0c6;
  --ink:#8fbaf5; --ink-soft:#1d3352; --on-ink:#0d1726;
  --red:#ff8087; --red-soft:#3a1d24;
  --ok:#6fd796; --ok-soft:#183324;
  --warn:#ffc163; --warn-soft:#3a2c14;
  --line:#2e4566; --line-faint:#1c2a3e; --margin:#5e2d38;
  --border:#283a52; --chip:#1c2a3d; color-scheme:dark;}

*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-weight:500;font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:880px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--border);
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:1.5rem;color:var(--ink);font-weight:800}
.brand .who{font-size:.9rem;color:var(--muted)}
.steps{display:flex;gap:4px;margin-top:8px;overflow-x:auto;padding-bottom:2px}
.steps button{flex:1 1 0;min-width:96px;border:0;background:none;padding:6px 4px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.8rem;color:var(--muted)}
.steps button .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1rem;border:2px solid var(--border);background:var(--surface)}
.steps button.done .n{background:var(--ink-soft);border-color:var(--ink);color:var(--ink)}
.steps button.on{color:var(--fg);font-weight:600}
.steps button.on .n{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.steps button:disabled{cursor:default;opacity:.55}

main{padding-block:22px 80px;display:flex;flex-direction:column;gap:18px}
.lead{display:flex;flex-direction:column;gap:6px}
.lead h2{font-size:1.75rem}
.lead p{margin:0;color:var(--muted);max-width:62ch}

.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.card h3{font-size:1.25rem;display:flex;align-items:center;gap:8px}
.tag{font-family:var(--f-body);font-size:.75rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);background:var(--ink-soft);padding:2px 8px;border-radius:999px}

/* animal picker */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.pick{border:2px solid var(--border);background:var(--surface);border-radius:16px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:500}
.pick .e{font-size:2.6rem;line-height:1}
.pick:hover{border-color:var(--line)}
.pick.sel{border-color:var(--ink);background:var(--ink-soft)}
.custom{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.inp{font:inherit;font-size:1.05rem;padding:10px 12px;border:2px solid var(--border);border-radius:12px;background:var(--paper);color:var(--fg);min-width:0}
.inp:focus{border-color:var(--ink);outline:none}

/* questions */
.q{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px dashed var(--border)}
.q:first-of-type{border-top:0;padding-top:0}
.qh{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
.qh label{font-weight:600}
.qh label small{display:block;font-weight:400;color:var(--muted);font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:4px 12px;font-size:.92rem}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip.static{cursor:default}
.chip.static:hover{border-color:var(--line);color:inherit}
textarea.ans{font:inherit;font-size:1.02rem;width:100%;resize:vertical;min-height:2.8rem;padding:8px 12px;border:2px solid var(--border);border-radius:12px;background:var(--paper);color:var(--fg)}
textarea.ans:focus{border-color:var(--ink);outline:none}
.say{border:1px solid var(--border);background:var(--surface);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;flex:0 0 auto;color:var(--ink)}
.say svg{width:18px;height:18px}

/* notebook */
.oli{font-family:var(--f-body);font-size:1.08rem;color:var(--ink);width:100%;resize:vertical;border:1px solid var(--border);border-left:4px double var(--margin);border-radius:4px 12px 12px 4px;
  line-height:var(--lh);padding:0 14px 0 18px;min-height:calc(var(--lh) * 4);
  background-color:var(--paper);
  background-image:linear-gradient(to bottom,transparent calc(var(--lh) - 1px),var(--line) calc(var(--lh) - 1px)),
    linear-gradient(to bottom,transparent calc(var(--lh)/4 - 1px),var(--line-faint) calc(var(--lh)/4 - 1px)),
    linear-gradient(to right,var(--line-faint) 1px,transparent 1px);
  background-size:100% var(--lh),100% calc(var(--lh)/4),calc(var(--lh)/4) 100%;background-attachment:local}
.oli:focus{outline:none;border-color:var(--ink);border-left-color:var(--margin)}
.oli.tall{min-height:calc(var(--lh) * 7)}
div.oli{white-space:pre-wrap;word-break:break-word;padding-block:0;min-height:0}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.help{display:flex;flex-direction:column;gap:8px}
.help .lbl{font-size:.78rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.frame{border:1px dashed var(--ink);background:transparent;color:var(--ink);border-radius:10px;padding:4px 10px;font-size:.92rem}
.frame:hover{background:var(--ink-soft)}
details.model{border-radius:12px;background:var(--chip);padding:8px 12px}
details.model summary{cursor:pointer;font-weight:600;color:var(--ink)}
details.model p{margin:8px 0 2px;font-style:italic}
details.model .note{font-size:.85rem;color:var(--muted);font-style:normal}

/* outline */
.outline{display:flex;flex-direction:column;gap:12px}
.outline ol{margin:0;padding-left:1.4rem;display:flex;flex-direction:column;gap:4px}
.outline .sec{font-family:var(--f-display);font-weight:700;font-size:1.15rem;color:var(--ink)}
.outline .empty{color:var(--red);font-style:italic}

.tip{background:var(--ink-soft);border-radius:14px;padding:12px 14px;font-size:.95rem}
.tip b{color:var(--ink)}
.alert{background:var(--warn-soft);color:var(--fg);border-radius:14px;padding:12px 14px;border:1px solid var(--warn)}
.alert b{color:var(--warn)}

/* buttons */
.nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:12px 20px;font-weight:600;font-size:1.02rem;display:inline-flex;align-items:center;gap:8px}
.btn.pri{background:var(--ink);color:var(--on-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sec{background:var(--surface);border:2px solid var(--border)}
.btn.red{background:var(--red);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* correction */
.check-layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.check-layout{grid-template-columns:1fr}}
.essay{display:flex;flex-direction:column;gap:2px}
.essay .ph{font-size:.75rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:8px}
mark{background:none;color:inherit;padding:0}
mark.err{text-decoration:underline wavy var(--red);text-decoration-thickness:2px;text-underline-offset:5px;color:var(--red)}
mark.err::after{content:attr(data-n);font-family:var(--f-body);font-size:.7rem;font-weight:700;color:#fff;background:var(--red);border-radius:999px;padding:0 5px;margin-left:2px;vertical-align:super;line-height:1}
mark.warn{background:var(--warn-soft);box-shadow:inset 0 -2px 0 var(--warn)}
mark.rep{box-shadow:inset 0 -2px 0 var(--warn)}
.legend{font-size:.82rem;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checks li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start}
.checks .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.9rem}
.checks .ok .ic{background:var(--ok-soft);color:var(--ok)}
.checks .no .ic{background:var(--red-soft);color:var(--red)}
.checks small{display:block;color:var(--muted)}
.score{font-family:var(--f-display);font-size:2.2rem;font-weight:800;color:var(--ink);line-height:1}
.score span{font-size:1rem;color:var(--muted);font-family:var(--f-body);font-weight:500}
.bar{height:10px;border-radius:999px;background:var(--line-faint);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:999px}

.teacher{border-color:var(--red)}
.teacher h3{color:var(--red)}
.pen{font-style:italic}
.lv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px 0;border-top:1px dashed var(--border)}
.lv .dots{display:flex;gap:4px}
.lv .dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}
.lv .dots i.f{background:var(--ink)}
.lv .lvl{font-size:.8rem;color:var(--muted);grid-column:1/-1}
.errs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.errs li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px}
.errs .num{width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;font-size:.75rem;font-weight:700;display:grid;place-items:center;margin-top:2px}
.errs q{font-weight:600;color:var(--red)}
.qs{margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:6px}
.spin{width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:sp 1s linear infinite;flex:0 0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.vers{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
.vers th,.vers td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border)}
.vers th{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tablewrap{overflow-x:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.95rem;z-index:20}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--red-soft);padding:10px 14px;border-radius:14px}

.home-link{color:inherit;text-decoration:none}
.btn.small{padding:6px 12px;font-size:.88rem}
a.btn{text-decoration:none;color:inherit}
.outline .sub{margin:8px 0 4px;font-weight:600}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tcard{border:2px solid var(--border);background:var(--surface);border-radius:18px;padding:16px;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto auto;column-gap:12px;row-gap:4px;text-decoration:none;color:var(--fg);align-items:start}
.tcard .e{font-size:2.4rem;line-height:1;grid-row:1/4}
.tcard .tt{font-family:var(--f-display);font-weight:700;font-size:1.25rem;line-height:1.2}
.tcard .td{font-size:.9rem;color:var(--muted)}
.tcard .st{justify-self:start;font-size:.75rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--muted)}
.tcard .st.on{background:var(--ink-soft);color:var(--ink)}
a.tcard:hover{border-color:var(--ink)}
.tcard.soon{opacity:.55;border-style:dashed}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1><a href="#" class="home-link">Em Học Viết Văn</a></h1>
      <div class="row"><span class="who" id="who"></span><button class="btn sec small" data-act="set-open">Cài đặt AI</button></div>
    </div>
    <nav class="steps" id="steps" aria-label="Các bước"></nav>
  </div>
</header>
<div class="wrap" id="settings" style="padding-top:18px" hidden></div>
<main class="wrap" id="main"></main>
<div class="toast" id="toast" hidden></div>

<!-- Mỗi kiểu bài là một file trong thư mục kieubai/. Thêm kiểu bài mới: thêm một dòng script ở đây. -->
<script src="kieubai/ta-con-vat.js"></script>
<script src="kieubai/ta-cay-coi.js"></script>

<script>
/* ======================= KHUNG DÙNG CHUNG ======================= */
const KB = window.KIEUBAI || [];
const SAP_CO = [
 {ten:'Thuật lại một sự việc', e:'📣'},
 {ten:'Kể lại câu chuyện', e:'📖'},
 {ten:'Đoạn văn nêu ý kiến', e:'💬'},
 {ten:'Viết thư', e:'✉️'}
];
const STEPS_MAC_DINH = ['Chọn đề','Quan sát, tìm ý','Dàn ý','Viết bài','Chữa bài'];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;

/* ---------- tiện ích đếm câu, đếm từ (dùng chung cho mọi kiểu bài) ---------- */
const words = s => (s||'').toLowerCase().split(/[^\p{L}\p{N}]+/u).filter(Boolean);
const sentences = s => (s||'').split(/[.!?…]+/).map(x=>x.trim()).filter(x => words(x).length >= 2);
const countWord = (text, w) => words(text).filter(x => x === w).length;
const U = {
  words, sentences, countWord,
  cau: s => sentences(s).length,
  all: e => Object.values(e).join(' '),
  soSanh: s => words(s).filter(x => ['như','tựa','giống'].includes(x)).length,
  demTu: (s, list) => { const t = (s||'').toLowerCase(); return list.filter(w => t.includes(w)).length; },
  list: a => (Array.isArray(a)?a:[]).map(x=>String(x).trim()).filter(Boolean).slice(0,8),
  bophan: a => (Array.isArray(a)?a:[]).map(b=>[String(b?.ten||'').trim(), (Array.isArray(b?.tu)?b.tu:[]).map(x=>String(x).trim()).filter(Boolean).slice(0,6)]).filter(p=>p[0]).slice(0,8)
};

/* ---------- trạng thái: mỗi kiểu bài lưu riêng trên máy ---------- */
let T = null, S = null;
const SKEY = id => 'em-hoc-viet-van:' + id;
const emptyEssay = () => Object.fromEntries(T.secs.map(s => [s.k, '']));
const fresh = () => ({step:0, reach:0, dt:null, custom:'', customData:null, ans:{}, essay:emptyEssay(), versions:[]});
function loadS(){
  try{ const v = JSON.parse(localStorage.getItem(SKEY(T.id))); if(v && v.essay) return Object.assign(fresh(), v, {essay:Object.assign(emptyEssay(), v.essay)}); }catch(e){}
  if(T.id === 'ta-con-vat'){ // chuyển bài cũ từ bản đầu tiên
    try{ const o = JSON.parse(localStorage.getItem('em-ta-con-vat-v1'));
      if(o && o.essay) return Object.assign(fresh(), {step:o.step||0, reach:o.reach||0, dt:o.animal||null, custom:o.custom||'',
        customData: o.customParts ? {for:o.customParts.for, data:{parts:o.customParts.parts, hoat:o.customParts.hoat}} : null,
        ans:Object.assign({}, o.ans, o.pet ? {ten:o.pet} : {}), essay:Object.assign(emptyEssay(), o.essay), versions:o.versions||[]});
    }catch(e){}
  }
  return fresh();
}
let saveT;
function save(){ if(!T) return; const id = T.id, data = S; clearTimeout(saveT); saveT = setTimeout(()=>{ try{ localStorage.setItem(SKEY(id), JSON.stringify(data)); }catch(e){} }, 250); }
function savedInfo(id){ try{ const v = JSON.parse(localStorage.getItem(SKEY(id)) || (id==='ta-con-vat' ? localStorage.getItem('em-ta-con-vat-v1') : 'null')); if(v && (v.dt || v.animal || v.versions?.length)) return v; }catch(e){} return null; }

/* ---------- đối tượng đang tả (con vật, cây...) ---------- */
function D(){
  if(!S || !S.dt) return null;
  if(S.dt === 'khac'){
    const k = T.chon.khac, raw = S.custom.trim().toLowerCase();
    const pre = k.tienTo.trim();
    const nm = raw ? (new RegExp('^' + pre + '\\s+').test(raw) ? raw : k.tienTo + raw) : k.tenMacDinh;
    const cd = S.customData && S.customData.for === S.custom.trim() ? S.customData.data : null;
    const base = Object.assign({}, T.chon.chung);
    if(cd) for(const [key,val] of Object.entries(cd)) if(Array.isArray(val) && val.length) base[key] = val;
    return Object.assign(base, {id:'khac', name:nm, short:nm.replace(new RegExp('^' + pre + '\\s+'), ''), e:k.e});
  }
  return T.chon.ds.find(x => x.id === S.dt) || null;
}
function C(){ const dt = D(); const ten = () => T.goi(dt, S.ans); return {dt, ans:S.ans, ten, Ten:() => cap(ten())}; }
const allQs = () => T.nhom(C()).flatMap(g => g.qs);
const val = k => (S.ans[k]||'').trim();

/* ---------- đọc to ---------- */
const canSpeak = 'speechSynthesis' in window;
const SPK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
function sayBtn(text){ return canSpeak ? `<button class="say" data-act="say" data-t="${esc(text)}" aria-label="Đọc to" title="Đọc to">${SPK}</button>` : ''; }
function speak(t){ try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang='vi-VN'; u.rate=.9; speechSynthesis.speak(u); }catch(e){} }

const GKEY = 'em-ta-con-vat-gemini';
const API = 'https://generativelanguage.googleapis.com/v1beta';
function loadG(){ try{ const v = JSON.parse(localStorage.getItem(GKEY)); if(v && typeof v.key==='string') return {key:v.key, model:v.model||'', models:Array.isArray(v.models)?v.models:[]}; }catch(e){} return {key:'', model:'', models:[]}; }
function saveG(){ try{ localStorage.setItem(GKEY, JSON.stringify(G)); }catch(e){} }

function gErr(code, message){ return {code, message: message||code}; }
async function gFetch(path, opts={}, key=G.key){
  let res;
  try{ res = await fetch(API + path, {...opts, headers:{'Content-Type':'application/json','x-goog-api-key':key}}); }
  catch(e){ if(e?.name==='AbortError') throw gErr('cancelled'); throw gErr('network', String(e)); }
  let body = null; try{ body = await res.json(); }catch(e){}
  if(!res.ok){
    const msg = body?.error?.message || ('HTTP ' + res.status);
    const reason = JSON.stringify(body?.error?.details||'');
    if(res.status===400 && /API_KEY_INVALID|API key not valid/i.test(msg + reason)) throw gErr('bad_key', msg);
    if(res.status===401 || res.status===403) throw gErr('bad_key', msg);
    if(res.status===404) throw gErr('bad_model', msg);
    if(res.status===429) throw gErr('rate_limited', msg);
    if(res.status>=500) throw gErr('upstream_error', msg);
    throw gErr('bad_request', msg);
  }
  return body;
}
function parseJSONLoose(t){
  try{ return JSON.parse(t); }catch(e){}
  const f = t.match(/```(?:json)?\s*([\s\S]*?)```/); if(f){ try{ return JSON.parse(f[1]); }catch(e){} }
  const i = t.search(/[\{\[]/), j = Math.max(t.lastIndexOf('}'), t.lastIndexOf(']'));
  if(i>=0 && j>i){ try{ return JSON.parse(t.slice(i,j+1)); }catch(e){} }
  throw gErr('invalid_json');
}
async function geminiJSON(prompt, opts={}){
  const body = {contents:[{role:'user', parts:[{text:prompt}]}], generationConfig:{temperature:0.4, responseMimeType:'application/json'}};
  const r = await gFetch(`/models/${encodeURIComponent(G.model)}:generateContent`, {method:'POST', body:JSON.stringify(body), signal:opts.signal});
  const c = r?.candidates?.[0];
  if(!c){ if(r?.promptFeedback?.blockReason) throw gErr('refused'); throw gErr('empty_completion'); }
  if(c.finishReason==='SAFETY' || c.finishReason==='PROHIBITED_CONTENT') throw gErr('refused');
  const text = (c.content?.parts||[]).filter(p=>!p.thought).map(p=>p.text||'').join('').trim();
  if(!text) throw gErr('empty_completion');
  return parseJSONLoose(text);
}
async function listModels(key){
  const r = await gFetch('/models?pageSize=200', {}, key);
  const ms = (r.models||[]).filter(m => (m.supportedGenerationMethods||[]).includes('generateContent'))
    .map(m => m.name.replace(/^models\//,''))
    .filter(n => /^gemini/.test(n) && !/(image|tts|audio|live|embedding|vision|robotics|computer-use|native)/i.test(n));
  const score = n => { const v = parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/)||[])[1]||0);
    return (/flash/.test(n)?1000:0) + (/lite/.test(n)?-300:0) + (/(preview|exp|\d{3,})/.test(n)?-100:0) + (/latest/.test(n)?-50:0) + v*10; };
  return ms.sort((a,b)=> score(b)-score(a));
}
function errCopy(code){
  if(code==='bad_key') return 'API key chưa đúng hoặc đã bị khóa. Nhờ thầy cô vào "Cài đặt AI" để kiểm tra lại.';
  if(code==='bad_model') return 'Mô hình AI đã chọn không còn dùng được. Nhờ thầy cô vào "Cài đặt AI" bấm "Kiểm tra và lưu" lại.';
  if(code==='rate_limited') return 'Cô AI đang bận vì nhiều bạn cùng gửi bài. Em đợi khoảng 1 phút rồi bấm lại nhé.';
  if(code==='network') return 'Máy chưa kết nối mạng được. Em kiểm tra mạng rồi bấm lại nhé.';
  if(code==='refused') return 'Cô AI chưa đọc được bài này. Em xem lại bài có từ ngữ nào chưa phù hợp không nhé.';
  if(code==='invalid_json'||code==='empty_completion') return 'Cô AI chưa trả lời rõ. Em bấm "Cô AI nhận xét" thêm lần nữa nhé.';
  return 'Có trục trặc khi gửi bài. Em bấm lại sau một chút nhé.';
}

async function testKey(){
  const key = ($('#gkey')?.value || '').trim() || G.key;
  if(!key){ setMsg='Thầy cô chưa dán API key.'; setOk=false; renderSettings(); return; }
  setBusy=true; setMsg=''; renderSettings();
  try{
    const ms = await listModels(key);
    if(!ms.length) throw gErr('bad_model','Không tìm thấy mô hình Gemini nào cho key này.');
    G.key = key; G.models = ms; if(!ms.includes(G.model)) G.model = ms[0];
    saveG(); setOk=true; setMsg=`Key dùng được. Đang dùng mô hình ${G.model}.`;
  }catch(e){ setOk=false; setMsg = e.code==='bad_key' ? 'Key không đúng. Thầy cô kiểm tra đã chép đủ cả key chưa.' : e.code==='network' ? 'Không kết nối được tới Google. Kiểm tra mạng của máy.' : 'Chưa kiểm tra được: ' + (e.message||e.code); }
  finally{ setBusy=false; renderSettings(); render(false); }
}

function lowerStarts(e){
  const out = [];
  for(const sec of Object.keys(e)){
    const t = e[sec] || ''; const re = /(^|[.!?…]\s*\n?\s*)(\p{L})/gu; let m;
    while((m = re.exec(t))){ const ch = m[2], pos = m.index + m[1].length; if(ch !== ch.toUpperCase()){ let i=pos; while(i<t.length && /\p{L}/u.test(t[i])) i++; out.push({sec, s:pos, e:i}); } }
  }
  return out;
}
function localCheck(e){
  const c = C(), all = U.all(e), first = T.secs[0].k, last = T.secs[T.secs.length-1].k;
  const items = [{ok: U.cau(e[first])>=1 && U.cau(e[last])>=1, t:'Có đủ mở bài và kết bài', h: U.cau(e[first])<1 ? 'Em chưa có mở bài. Hãy viết câu giới thiệu.' : 'Em chưa có kết bài. Hãy nói tình cảm của em.'}];
  items.push(...T.kiemTra(e, c, U));
  const low = lowerStarts(e);
  items.push({ok: low.length===0, t:'Viết hoa chữ đầu câu', h:`Có ${low.length} chỗ chữ đầu câu chưa viết hoa (tô màu vàng trong bài).`});
  const nNo = countWord(all,'nó'), nRat = countWord(all,'rất'), nVa = countWord(all,'và'), rep = [];
  if(nNo>4) rep.push(`"nó" (${nNo} lần)`); if(nRat>3) rep.push(`"rất" (${nRat} lần)`); if(nVa>5) rep.push(`"và" (${nVa} lần)`);
  items.push({ok: rep.length===0, t:'Không lặp từ quá nhiều', h:`Em dùng ${rep.join(', ')}. Thử thay bằng tên gọi hoặc từ khác.`});
  const longS = Object.values(e).flatMap(sentences).filter(x => words(x).length > 35).length;
  items.push({ok: longS===0, t:'Câu không quá dài', h:`Có ${longS} câu quá dài. Hãy đặt dấu chấm để tách thành câu ngắn hơn.`});
  return {items, score: items.filter(i=>i.ok).length, total: items.length, words: words(all).length};
}

function marked(text, sec, v){
  const ranges = [];
  lowerStarts({[sec]:text}).forEach(r => ranges.push({s:r.s, e:r.e, cls:'warn', title:'Chữ đầu câu phải viết hoa'}));
  if(countWord(U.all(v.essay),'nó') > 4){
    const re = /(^|[^\p{L}])(nó)(?=[^\p{L}]|$)/giu; let m, c=0;
    while((m = re.exec(text))){ c++; if(c>1){ const s = m.index + m[1].length; ranges.push({s, e:s+m[2].length, cls:'rep', title:'Từ "nó" bị lặp. Thử thay bằng tên gọi.'}); } }
  }
  (v.ai?.loi||[]).forEach((l,i) => { if(l.phan===sec){ const s = text.indexOf(l.doan); if(s>=0) ranges.push({s, e:s+l.doan.length, cls:'err', n:i+1, title:l.goiy}); } });
  ranges.sort((a,b)=> a.s-b.s || (b.cls==='err')-(a.cls==='err'));
  let out='', pos=0;
  for(const r of ranges){ if(r.s < pos) continue; out += esc(text.slice(pos,r.s)) + `<mark class="${r.cls}" ${r.n?`data-n="${r.n}"`:''} title="${esc(r.title)}">${esc(text.slice(r.s,r.e))}</mark>`; pos = r.e; }
  return out + esc(text.slice(pos));
}

  const v = cur();
  if(!v) return `<div class="card"><p>Em chưa nộp bài nào.</p><button class="btn pri" data-act="go" data-i="3">Đi viết bài</button></div>`;
  const lc = localCheck(v.essay), ai = v.ai, levels = ['','Cần cố gắng thêm','Đã làm được','Làm tốt'], doDai = T.doDai || 150;
  let aiBox;
  if(aiBusy) aiBox = `<div class="row"><span class="spin"></span><span>Cô đang đọc bài của em… (khoảng nửa phút)</span><button class="btn sec" data-act="stop">Dừng</button></div>`;
  else if(ai) aiBox = `
     <div class="qh"><p class="pen" style="margin:0"><b>Cô khen:</b> ${ai.khen.map(esc).join(' ')}</p>${sayBtn('Cô khen: ' + ai.khen.join(' ') + ' ' + ai.dongvien)}</div>
     <div>${ai.tieuchi.map(t=>`<div class="lv"><span>${esc(t.ten)}</span><span class="dots" aria-label="${levels[t.muc]}">${[1,2,3].map(i=>`<i class="${i<=t.muc?'f':''}"></i>`).join('')}</span><span class="lvl">${levels[t.muc]}${t.nhanxet?' – '+esc(t.nhanxet):''}</span></div>`).join('')}</div>
     ${ai.goiy.length?`<div><b>Em thử nghĩ thêm:</b><ol class="qs">${ai.goiy.map(g=>`<li>${esc(g)}</li>`).join('')}</ol></div>`:''}
     ${ai.loi.length?`<div><b>Chỗ cần sửa</b> (số đỏ trong bài):<ul class="errs">${ai.loi.map((l,i)=>`<li><span class="num">${i+1}</span><span><q>${esc(l.doan)}</q> <small style="color:var(--muted)">(${esc(l.loai)})</small><br>${esc(l.goiy)}</span></li>`).join('')}</ul></div>`:''}
     ${ai.dongvien?`<p class="pen" style="margin:0">${esc(ai.dongvien)}</p>`:''}
     <div class="row"><button class="btn sec" data-act="ai">Nhận xét lại</button></div>`;
  else if(aiOn()) aiBox = `<p style="margin:0">Cô AI sẽ đọc cả bài, khen điều em làm tốt và chỉ ra chỗ cần sửa. Cô không viết lại bài cho em đâu.</p><div class="row"><button class="btn red" data-act="ai">Cô AI nhận xét</button></div>`;
  else aiBox = `<p style="margin:0;color:var(--muted)">Máy này chưa cài AI. Nhờ thầy cô bấm "Cài đặt AI" ở trên cùng và dán API key Gemini. Em vẫn dùng được phần Kiểm tra nhanh.</p>`;
  if(aiMsg) aiBox += `<p style="margin:0;color:var(--red)">${esc(aiMsg)}</p>`;
  const pct = Math.min(100, Math.round(lc.words/doDai*100));
  return `
  <section class="lead"><h2>Chữa bài</h2><p>Đọc kỹ nhận xét, rồi bấm "Sửa bài" để tự sửa. Sửa xong em nộp lại để xem mình tiến bộ thế nào.</p></section>
  <div class="check-layout">
    <div class="card"><div class="qh"><h3>Bài của em <span class="tag">Lần ${S.versions.length}</span></h3>${sayBtn(Object.values(v.essay).join(' '))}</div>
      <div class="essay">${T.secs.map(s=>`<div class="ph">${esc(s.title)}</div><div class="oli">${marked(v.essay[s.k]||'',s.k,v) || '<span style="color:var(--muted)">(chưa viết)</span>'}</div>`).join('')}</div>
      <div class="legend"><span><i style="background:var(--red)"></i>Cô AI chỉ lỗi</span><span><i style="background:var(--warn)"></i>Chưa viết hoa / lặp từ</span></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:18px;min-width:0">
      <div class="card"><h3>Kiểm tra nhanh</h3>
        <div class="score">${lc.score}<span> / ${lc.total} điều đã làm tốt</span></div>
        <div><div class="meta"><span>Độ dài: ${lc.words} chữ</span><span>Nên khoảng ${doDai} chữ trở lên</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>
        <ul class="checks">${lc.items.map(i=>`<li class="${i.ok?'ok':'no'}"><span class="ic" aria-hidden="true">${i.ok?'✓':'!'}</span><span>${esc(i.t)}${i.ok?'':`<small>${esc(i.h)}</small>`}</span></li>`).join('')}</ul>
      </div>
      <div class="card teacher"><h3>Cô nhận xét</h3>${aiBox}</div>
    </div>
  </div>
  ${S.versions.length>1?`<div class="card"><h3>Em tiến bộ qua các lần nộp</h3><div class="tablewrap"><table class="vers"><thead><tr><th>Lần</th><th>Số chữ</th><th>Kiểm tra nhanh</th><th>Cô AI chấm</th></tr></thead><tbody>
    ${S.versions.map((x,i)=>{const l=localCheck(x.essay); const sc = x.ai ? x.ai.tieuchi.reduce((a,t)=>a+t.muc,0)+' / '+x.ai.tieuchi.length*3 : '–'; return `<tr><td>Lần ${i+1}</td><td>${l.words}</td><td>${l.score} / ${l.total}</td><td>${sc}</td></tr>`;}).join('')}
  </tbody></table></div></div>`:''}
  <div class="nav"><button class="btn pri" data-act="go" data-i="3">← Sửa bài</button>
    <div class="row"><button class="btn sec" data-act="copy">Chép bài để gửi cô</button><button class="btn sec" data-act="reset">Làm bài mới</button></div></div>
  <div id="confirm"></div>`;
}

/* ======================= GỌI GEMINI ======================= */
function buildPrompt(e){
  const c = C(), tc = T.ai.tieuChi;
  const bai = T.secs.map(s => `[${s.title.toUpperCase()}]\n${(e[s.k]||'').trim() || '(bỏ trống)'}`).join('\n');
  const mau = {khen:['...','...'], tieuchi: tc.map(t=>({ten:t, muc:2, nhanxet:'...'})), goiy:['...'], loi:[{phan:T.secs[1].k, doan:'...', loai:'chính tả', goiy:'...'}], dongvien:'...'};
  return `Bạn là cô giáo dạy Tiếng Việt lớp 4 ở Việt Nam, hiền và hay động viên. Một học sinh lớp 4 (9–10 tuổi, viết văn còn yếu) vừa viết ${T.ai.deBai(c)}.

BÀI CỦA HỌC SINH (giữ nguyên, kể cả lỗi):
${bai}

Nhiệm vụ: nhận xét để học sinh TỰ sửa bài.
Quy tắc bắt buộc:
- Không viết lại bài, không viết câu văn hoàn chỉnh thay học sinh.
- Lời ngắn, dễ hiểu với trẻ 9 tuổi. Xưng "cô", gọi học sinh là "em".
- "khen": 2 lời khen cụ thể, nhắc đúng chi tiết em đã viết.
- "goiy": tối đa 3 CÂU HỎI giúp em nghĩ thêm (ví dụ: "${T.ai.viDu}"), ưu tiên điều quan trọng nhất.
- "loi": tối đa 6 lỗi quan trọng nhất (chính tả, dùng từ, câu sai). "doan" phải chép NGUYÊN VĂN 1–6 chữ có trong bài, đúng từng dấu. "phan" là một trong: ${T.secs.map(s=>s.k).join(', ')} (${T.secs.map(s=>s.k+' = '+s.title).join('; ')}). Lỗi chính tả thì "goiy" ghi chữ viết đúng; lỗi khác thì "goiy" là lời nhắc ngắn, không viết lại cả câu.
- "tieuchi": đúng ${tc.length} tiêu chí như mẫu, "muc" là 3 (Làm tốt), 2 (Đã làm được) hoặc 1 (Cần cố gắng thêm), "nhanxet" một câu ngắn.
- "dongvien": một câu động viên.

Chỉ trả lời bằng một đối tượng JSON theo đúng dạng:
${JSON.stringify(mau)}`;
}
function normalize(r, e){
  const arr = x => Array.isArray(x) ? x : [], str = x => typeof x === 'string' ? x.trim() : '', keys = T.secs.map(s=>s.k);
  return {
    khen: arr(r?.khen).map(str).filter(Boolean).slice(0,2),
    tieuchi: arr(r?.tieuchi).map(t=>({ten:str(t?.ten), muc: Math.min(3,Math.max(1,Math.round(Number(t?.muc)||1))), nhanxet:str(t?.nhanxet)})).filter(t=>t.ten).slice(0,8),
    goiy: arr(r?.goiy).map(str).filter(Boolean).slice(0,3),
    loi: arr(r?.loi).map(l=>({phan:str(l?.phan), doan:str(l?.doan), loai:str(l?.loai)||'lỗi', goiy:str(l?.goiy)}))
      .map(l=>{ if(!(e[l.phan]||'').includes(l.doan)) l.phan = keys.find(k=>(e[k]||'').includes(l.doan)) || ''; return l; })
      .filter(l=>l.doan && l.phan).slice(0,6),
    dongvien: str(r?.dongvien)
  };
}
async function askAI(){
  const v = cur(); if(!v || !aiOn() || aiBusy) return;
  const myT = T; aiBusy = true; aiMsg=''; aiCtl = new AbortController(); render(false);
  try{ const r = await geminiJSON(buildPrompt(v.essay), {signal: aiCtl.signal}); if(T===myT){ v.ai = normalize(r, v.essay); save(); } }
  catch(e){ if(e?.code !== 'cancelled') aiMsg = errCopy(e?.code); }
  finally{ aiBusy = false; if(T===myT && S.step===4) render(false); }
}
async function wordBank(){
  const tn = T.chon.khac.tuNguAI; if(!aiOn() || wbBusy || !tn) return;
  const myT = T, raw = S.custom.trim();
  wbBusy = true; render(false);
  try{ const r = await geminiJSON(tn.prompt(C().dt.name)); const data = tn.apply(r, U);
    if(T===myT && data){ S.customData = {for:raw, data}; save(); toast('Đã có từ gợi ý mới'); } }
  catch(e){ if(e?.code!=='cancelled') toast(errCopy(e?.code)); }
  finally{ wbBusy=false; if(T===myT && S.step===1) render(false); }
}

/* ======================= SỰ KIỆN ======================= */
function goStep(i){ S.step = i; S.reach = Math.max(S.reach, i); save(); render(); }
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act;
  if(act==='set-open'){ setOpen=!setOpen; setMsg=''; renderSettings(); if(setOpen) window.scrollTo({top:0}); return; }
  if(act==='set-close'){ setOpen=false; renderSettings(); return; }
  if(act==='set-test'){ testKey(); return; }
  if(act==='set-clear'){ G={key:'',model:'',models:[]}; try{ localStorage.removeItem(GKEY); }catch(e){} setOk=true; setMsg='Đã xóa key khỏi máy này.'; renderSettings(); render(false); return; }
  if(act==='say'){ speak(b.dataset.t); return; }
  if(!T) return;
  if(act==='go'){ goStep(+b.dataset.i); }
  else if(act==='pick'){ const id=b.dataset.id; S.dt=id; save(); render(false); if(id==='khac') setTimeout(()=>$('#custom')?.focus(),0); }
  else if(act==='next'){
    if(S.step===1){ const need = T.batBuoc(C(), U);
      if(need.length){ $('#miss').innerHTML = `<div class="alert"><b>Em còn thiếu:</b> ${esc(need.join('; '))}. Bấm vào từ gợi ý nếu em chưa nghĩ ra nhé.</div>`; $('#miss').scrollIntoView({behavior:'smooth',block:'center'}); return; } }
    goStep(S.step+1);
  }
  else if(act==='back'){ goStep(S.step-1); }
  else if(act==='chip'){
    const k=b.dataset.k, w=b.dataset.w, c0=(S.ans[k]||'').trim();
    S.ans[k] = c0 ? c0.replace(/[,\s]+$/,'') + ', ' + w : w; save();
    const ta = document.getElementById('q-'+k); if(ta) ta.value = S.ans[k];
  }
  else if(act==='frame'){
    const sec=b.dataset.sec, t=b.dataset.t, ta=$('#w-'+sec);
    let v = S.essay[sec] || ''; if(v && !/\s$/.test(v)) v += ' ';
    S.essay[sec] = v + t; ta.value = S.essay[sec]; ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
    $('#c-'+sec).textContent = countLine(sec); save();
  }
  else if(act==='submit'){
    const e = {...S.essay};
    if(!words(U.all(e)).length){ toast('Em viết bài trước rồi mới nộp nhé'); return; }
    const last = cur();
    if(!last || JSON.stringify(last.essay)!==JSON.stringify(e)) S.versions.push({t:Date.now(), essay:e, ai:null});
    aiMsg=''; goStep(4);
  }
  else if(act==='ai'){ askAI(); }
  else if(act==='stop'){ aiCtl?.abort(); }
  else if(act==='wordbank'){ wordBank(); }
  else if(act==='copy'){
    const v=cur(), dt=D();
    const text = `BÀI VĂN ${T.ten.toUpperCase()}: ${dt.name.toUpperCase()}\n\n` + T.secs.map(s=>(v.essay[s.k]||'').trim()).filter(Boolean).join('\n\n');
    const done = ()=>toast('Đã chép bài. Em dán vào tin nhắn gửi cô nhé.');
    try{ navigator.clipboard.writeText(text).then(done, ()=>fallbackCopy(text)); }catch(e){ fallbackCopy(text); }
  }
  else if(act==='reset'){
    $('#confirm').innerHTML = `<div class="confirm"><span>Bài ${esc(T.ten.toLowerCase())} hiện tại sẽ bị xóa khỏi máy này. Em chắc chưa?</span><button class="btn red" data-act="reset-yes">Xóa và làm bài mới</button><button class="btn sec" data-act="reset-no">Thôi</button></div>`;
  }
  else if(act==='reset-yes'){ S = fresh(); try{ localStorage.removeItem(SKEY(T.id)); if(T.id==='ta-con-vat') localStorage.removeItem('em-ta-con-vat-v1'); }catch(e){} render(); }
  else if(act==='reset-no'){ $('#confirm').innerHTML=''; }
});
function fallbackCopy(text){
  const ta = document.createElement('textarea'); ta.value=text; ta.className='oli'; ta.style.minHeight='12rem';
  $('#confirm').innerHTML = '<p style="margin:0 0 6px">Máy chưa cho chép tự động. Em chọn hết chữ dưới đây rồi chép nhé:</p>'; $('#confirm').append(ta); ta.focus(); ta.select();
}
document.addEventListener('input', ev => {
  const el = ev.target; if(!T) return;
  if(el.dataset.sec){ S.essay[el.dataset.sec] = el.value; const c=$('#c-'+el.dataset.sec); if(c) c.textContent = countLine(el.dataset.sec); save(); return; }
  const k = el.dataset.k; if(!k) return;
  if(k==='custom'){ S.custom = el.value; const nb=document.querySelector('[data-act="next"]'); if(nb) nb.disabled = !el.value.trim(); }
  else S.ans[k] = el.value;
  save();
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if(el.id==='gmodel'){ G.model = el.value; saveG(); setOk=true; setMsg='Đã chuyển sang ' + G.model + '.'; renderSettings(); return; }
  if(el.dataset.rr && T && S.step===1){ setTimeout(()=>{ const id=document.activeElement?.id; const y=window.scrollY; render(false); window.scrollTo({top:y}); if(id){ const f=document.getElementById(id); if(f){ f.focus({preventScroll:true}); try{ f.setSelectionRange(f.value.length, f.value.length); }catch(e){} } } },0); }
});

/* ---------- điều hướng: #ta-con-vat, #ta-cay-coi ... ---------- */
function route(){
  const id = decodeURIComponent(location.hash.slice(1));
  const nt = KB.find(k => k.id === id) || null;
  if(nt !== T){ T = nt; S = T ? loadS() : null; aiCtl?.abort(); aiBusy=false; aiMsg=''; wbBusy=false; }
  render();
}
window.addEventListener('hashchange', route);
route();
if(!G.key) setOpen = true;
renderSettings();
</script>
